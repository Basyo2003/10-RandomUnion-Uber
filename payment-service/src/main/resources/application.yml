spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://payment-postgres:5432/uberdb-payments
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: redis
      port: 6379
      password: redispass
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

server:
  port: 8080

jwt:
  secret: dVJlckp3dFNoYXJlZFNlY3JldEtleUZvckFsbEZpdmVTZXJ2aWNlczEyMzQ1Ng==
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: payment-service
    distribution:
      percentiles-histogram:
        http.server.requests: true

feign:
  user-service:
    url: http://user-service:8080
  ride-service:
    url: http://ride-service:8080
  driver-service:
    url: http://driver-service:8080
