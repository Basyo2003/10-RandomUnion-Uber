apiVersion: apps/v1
kind: Deployment
metadata:
  name: location-service
  namespace: uber

spec:
  replicas: 1

  selector:
    matchLabels:
      app: location-service

  template:
    metadata:
      labels:
        app: location-service

    spec:

      initContainers:
        - name: wait-for-cassandra
          image: cassandra:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for Cassandra..."
              until cqlsh cassandra 9042 -e "DESCRIBE KEYSPACES"; do
                echo "Cassandra not ready yet..."
                sleep 10
              done

              echo "Creating keyspace if missing..."
              cqlsh cassandra 9042 -e "CREATE KEYSPACE IF NOT EXISTS uberks WITH replication = {'class':'SimpleStrategy','replication_factor':1};"

              echo "Cassandra is ready"
      containers:
        - name: location-service
          image: location-service:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: location-service-configmap

            - secretRef:
                name: location-postgres-secret

          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: location-postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            limits:
              memory: 768Mi

            requests:
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080

            initialDelaySeconds: 60
            periodSeconds: 30