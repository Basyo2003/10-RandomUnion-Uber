apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: default
  labels:
    grafana_dashboard: "1"
data:
  user-dashboard.json: |-
    # placeholder — S1-INFRA fills this
  driver-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki_datasource}"
              },
              "editorMode": "code",
              "expr": "{app=\"uber\", service=\"driver-service\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Driver service - stream",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki_datasource}"
              },
              "editorMode": "code",
              "expr": "{app=\"uber\", service=\"driver-service\", level=\"ERROR\"}",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Driver service - ERROR (label)",
          "type": "logs"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${loki_datasource}"
          },
          "gridPos": {
            "h": 10,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${loki_datasource}"
              },
              "editorMode": "code",
              "expr": "{app=\"uber\", service=\"driver-service\"} |~ \"\\\"correlationId\\\":\"\"",
              "queryType": "range",
              "refId": "A"
            }
          ],
          "title": "Driver service - JSON logs with correlationId",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "uber",
        "driver-service",
        "S2-READ-DB"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Loki",
            "multi": false,
            "name": "loki_datasource",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Driver service (S2 READ-DB)",
      "uid": "m3-driver-service-s2",
      "version": 1
    }
  ride-dashboard.json: |-
    # placeholder — S3-INFRA fills this (merge LogQL from S3-READ-DB + PromQL from S3-EVENTS)
  location-dashboard.json: |-
    # placeholder — S4-INFRA fills this
  payment-dashboard.json: |-
    # placeholder — S5-INFRA fills this
