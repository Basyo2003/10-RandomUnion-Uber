apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: default
        type: file
        options:
          path: /etc/grafana/provisioning/dashboards
  user-dashboard.json: |-
    # placeholder — S1-INFRA fills this
  driver-dashboard.json: |-
    {
      "annotations": {
        "list": []
      },
      "description": "Driver Service dashboard - PromQL panels from S2-EVENTS. LogQL panels added by S2-INFRA.",
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "Error Rate (LogQL)",
          "description": "Count of ERROR-level log lines from driver-service per minute.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "sum(count_over_time({app=\"uber\", service=\"driver-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "Errors/min",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          },
          "title": "RabbitMQ Event Audit (LogQL)",
          "description": "Log lines emitted by driver-service event publishers and consumers, filtered by routing key.",
          "type": "logs",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "{app=\"uber\", service=\"driver-service\"} | json | routingKey != \"\"",
              "legendFormat": "Events",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "${ds_loki}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "Feign Call Outcomes (LogQL)",
          "description": "Successful Feign calls vs FeignException catches from driver-service.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "sum(count_over_time({app=\"uber\", service=\"driver-service\"} |= \"returned successfully\" [1m]))",
              "legendFormat": "Feign Success/min",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "loki",
                "uid": "${ds_loki}"
              },
              "expr": "sum(count_over_time({app=\"uber\", service=\"driver-service\"} |= \"Feign call\" |= \"failed\" [1m]))",
              "legendFormat": "Feign Failures/min",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 4,
          "options": {
            "legend": {
              "calcs": ["mean", "lastNotNull"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "HTTP Request Rate",
          "description": "Requests/sec per endpoint and method.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum by (uri, method, status) (rate(http_server_requests_seconds_count{job=\"driver-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}} {{status}}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 5,
          "options": {
            "legend": {
              "calcs": ["mean", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "HTTP Latency P99",
          "description": "99th-percentile latency per endpoint.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.99, sum by (uri, le) (rate(http_server_requests_seconds_bucket{job=\"driver-service\"}[5m])))",
              "legendFormat": "p99 {{uri}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "histogram_quantile(0.95, sum by (uri, le) (rate(http_server_requests_seconds_bucket{job=\"driver-service\"}[5m])))",
              "legendFormat": "p95 {{uri}}",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "id": 6,
          "options": {
            "legend": {
              "calcs": ["lastNotNull"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "JVM Heap Usage",
          "description": "Used vs committed heap. OOM risk if used approaches 768Mi limit.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "jvm_memory_used_bytes{job=\"driver-service\", area=\"heap\"}",
              "legendFormat": "heap used",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "jvm_memory_committed_bytes{job=\"driver-service\", area=\"heap\"}",
              "legendFormat": "heap committed",
              "refId": "B"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "id": 7,
          "options": {
            "legend": {
              "calcs": ["lastNotNull", "max"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "HikariCP DB Connection Pool",
          "description": "Active vs max pool connections.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "hikaricp_connections_active{job=\"driver-service\"}",
              "legendFormat": "active",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "hikaricp_connections_max{job=\"driver-service\"}",
              "legendFormat": "max",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "hikaricp_connections_pending{job=\"driver-service\"}",
              "legendFormat": "pending",
              "refId": "C"
            }
          ]
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "lineWidth": 1
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "id": 8,
          "options": {
            "legend": {
              "calcs": ["mean", "lastNotNull"],
              "displayMode": "table",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "title": "Cache Hit/Miss Ratio (PromQL)",
          "description": "Redis cache hits vs misses for driver-service.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(rate(cache_gets_total{job=\"driver-service\", result=\"hit\"}[5m]))",
              "legendFormat": "Cache Hits/sec",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${ds_prometheus}"
              },
              "expr": "sum(rate(cache_gets_total{job=\"driver-service\", result=\"miss\"}[5m]))",
              "legendFormat": "Cache Misses/sec",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["uber", "driver-service", "m3", "s2-events", "s2-infra"],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "name": "ds_prometheus",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "label": "Loki",
            "name": "ds_loki",
            "options": [],
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "Driver Service",
      "uid": "uber-driver-service",
      "version": 1
    }
  ride-dashboard.json: |-
    {
      "id": null,
      "uid": "ride-service-dashboard",
      "title": "Ride Service Dashboard",
      "tags": ["uber", "ride-service"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Error Rate (logs/min)",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(rate({app=\"uber\", service=\"ride-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "RabbitMQ Event Audit",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"uber\", service=\"ride-service\"} |~ \"Published|Consuming\"",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "title": "Saga State Transitions",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{app=\"uber\", service=\"ride-service\"} |= \"transitioning\"",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "title": "HTTP Request Rate (req/sec)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"ride-service\"}[5m])) by (uri, method)",
              "legendFormat": "{{method}} {{uri}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 5,
          "title": "HTTP Latency P99 (seconds)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{job=\"ride-service\"}[5m])) by (le, uri))",
              "legendFormat": "P99 {{uri}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        },
        {
          "id": 6,
          "title": "JVM Heap Usage (bytes)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"ride-service\", area=\"heap\"}",
              "legendFormat": "Heap Used",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 }
        }
      ]
    }
  location-dashboard.json: |-
    {
      "id": null,
      "uid": "uber-location-service",
      "title": "Location Service Dashboard",
      "description": "S4-INFRA dashboard for Location Service.",
      "tags": ["uber", "location-service", "s4-infra"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (uri, method, status) (rate(http_server_requests_seconds_count{job=\"location-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}} {{status}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Average Request Duration",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_sum{job=\"location-service\"}[5m]) / rate(http_server_requests_seconds_count{job=\"location-service\"}[5m])",
              "legendFormat": "avg duration",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "JVM Heap Usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"location-service\", area=\"heap\"}",
              "legendFormat": "heap used",
              "refId": "A"
            },
            {
              "expr": "jvm_memory_committed_bytes{job=\"location-service\", area=\"heap\"}",
              "legendFormat": "heap committed",
              "refId": "B"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HikariCP Postgres Connection Pool",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "hikaricp_connections_active{job=\"location-service\"}",
              "legendFormat": "active",
              "refId": "A"
            },
            {
              "expr": "hikaricp_connections_idle{job=\"location-service\"}",
              "legendFormat": "idle",
              "refId": "B"
            },
            {
              "expr": "hikaricp_connections_max{job=\"location-service\"}",
              "legendFormat": "max",
              "refId": "C"
            },
            {
              "expr": "hikaricp_connections_pending{job=\"location-service\"}",
              "legendFormat": "pending",
              "refId": "D"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Redis Operations",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(lettuce_seconds_count{job=\"location-service\"}[5m])",
              "legendFormat": "{{db_operation}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "RabbitMQ Activity",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rabbitmq_connections{name=\"rabbit\"}",
              "legendFormat": "connections",
              "refId": "A"
            },
            {
              "expr": "rabbitmq_channels{name=\"rabbit\"}",
              "legendFormat": "channels",
              "refId": "B"
            },
            {
              "expr": "rate(rabbitmq_published_total{name=\"rabbit\"}[5m])",
              "legendFormat": "published/sec",
              "refId": "C"
            },
            {
              "expr": "rate(rabbitmq_consumed_total{name=\"rabbit\"}[5m])",
              "legendFormat": "consumed/sec",
              "refId": "D"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Cassandra Repository Activity",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "spring_data_repository_invocations_seconds_count{repository=\"LocationTrackingEventRepository\"}",
              "legendFormat": "{{method}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Mongo Repository Activity",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "spring_data_repository_invocations_seconds_count{repository=\"LocationEventRepository\"}",
              "legendFormat": "{{method}}",
              "refId": "A"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 }
        }
      ]
    }
  payment-dashboard.json: |-
    {
      "annotations": {"list": []},
      "description": "Payment Service dashboard — LogQL + PromQL panels (S5-READ-DB / S5-INFRA).",
      "editable": true,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "${ds_loki}"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "custom": {"lineWidth": 1}},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "title": "Error Rate (LogQL)",
          "description": "Count of ERROR-level log lines from payment-service per minute.",
          "type": "timeseries",
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "${ds_loki}"},
              "expr": "sum(count_over_time({app=\"uber\", service=\"payment-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "Errors/min",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {"type": "loki", "uid": "${ds_loki}"},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 0},
          "id": 2,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "showTime": true,
            "sortOrder": "Descending"
          },
          "title": "Payment Event Audit (LogQL)",
          "description": "Log lines from payment-service event publishers and consumers, filtered by routing key.",
          "type": "logs",
          "targets": [
            {
              "datasource": {"type": "loki", "uid": "${ds_loki}"},
              "expr": "{app=\"uber\", service=\"payment-service\"} | json | routingKey != \"\"",
              "legendFormat": "Events",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": {"type": "loki", "uid": "${ds_loki}"},
          "fieldConfig": {
            "defaults": {"color": {"mode": "palette-classic"}, "custom": {"lineWidth": 1}},
            "overrides": []
          },
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 0},
          "id": 3,
          "options": {
            "legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "title": "Payment State Transitions (LogQL)",
          "description": "COMPLETED vs REFUNDED vs FAILED payment events per minute.",
          "type": "timeseries",
          "targets": [
