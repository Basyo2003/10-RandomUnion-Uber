apiVersion: v1
kind: ConfigMap
metadata:
  name: location-service-configmap
  namespace: uber
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://location-postgres:5432/uberdb-locations
  SPRING_DATASOURCE_USERNAME: postgres

  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: redispass

  SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin

  SPRING_CASSANDRA_CONTACT_POINTS: cassandra
  SPRING_CASSANDRA_PORT: "9042"
  SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
  SPRING_CASSANDRA_KEYSPACE_NAME: uberks
  SPRING_CASSANDRA_SCHEMA_ACTION: CREATE_IF_NOT_EXISTS
  SPRING_CASSANDRA_REQUEST_TIMEOUT: 10s
  SPRING_CASSANDRA_CONNECTION_CONNECT_TIMEOUT: 10s
  SPRING_CASSANDRA_CONNECTION_INIT_QUERY_TIMEOUT: 10s

  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest

  SPRING_RABBITMQ_LISTENER_SIMPLE_ACKNOWLEDGE_MODE: auto
  SPRING_RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED: "false"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED: "true"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: "1000"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: "3"

  FEIGN_DRIVER_SERVICE_URL: http://driver-service:8080
  FEIGN_RIDE_SERVICE_URL: http://ride-service:8080
  FEIGN_USER_SERVICE_URL: http://user-service:8080
  FEIGN_PAYMENT_SERVICE_URL: http://payment-service:8080