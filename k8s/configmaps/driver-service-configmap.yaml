apiVersion: v1
kind: ConfigMap
metadata:
  name: driver-service-configmap
  namespace: uber
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://driver-postgres:5432/uberdb-drivers
  SPRING_DATASOURCE_USERNAME: user

  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: guest
  SPRING_RABBITMQ_PASSWORD: guest

  SPRING_RABBITMQ_LISTENER_SIMPLE_ACKNOWLEDGE_MODE: auto
  SPRING_RABBITMQ_LISTENER_SIMPLE_DEFAULT_REQUEUE_REJECTED: "false"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED: "true"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: "1000"
  SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: "3"

  FEIGN_RIDE_SERVICE_URL: http://ride-service:8080
  FEIGN_USER_SERVICE_URL: http://user-service:8080
