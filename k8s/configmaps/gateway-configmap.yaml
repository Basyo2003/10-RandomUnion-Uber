apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-configmap
  namespace: uber
data:
  SPRING_APPLICATION_NAME: api-gateway
  SERVER_PORT: "8080"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

  # Routes use the Spring Cloud 2025.x namespace: spring.cloud.gateway.server.webflux
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: user-service
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://user-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: "Path=/api/users/**,/api/auth/**"

  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: driver-service
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://driver-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: "Path=/api/drivers/**"

  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: ride-service
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://ride-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: "Path=/api/rides/**"

  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: location-service
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://location-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: "Path=/api/locations/**"

  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: payment-service
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://payment-service:8080
  SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: "Path=/api/payments/**"
