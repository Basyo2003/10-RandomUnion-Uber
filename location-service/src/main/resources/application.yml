spring:
  application:
    name: location-service
  datasource:
    url: jdbc:postgresql://location-postgres:5432/uberdb-locations
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: redis
      port: 6379
      password: redispass
    mongodb:
      uri: mongodb://root:rootpass@mongo:27017/ubermongo?authSource=admin
  cassandra:
    contact-points: cassandra
    port: 9042
    local-datacenter: datacenter1
    keyspace-name: uberks
    schema-action: CREATE_IF_NOT_EXISTS
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

server:
  port: 8080

feign:
  driver-service:
    url: http://driver-service:8080
  location-service:
    url: http://location-service:8080
  ride-service:
    url: http://ride-service:8080
  user-service:
    url: http://user-service:8080
  payment-service:
    url: http://payment-service:8080
jwt:
  secret: dVJlckp3dFNoYXJlZFNlY3JldEtleUZvckFsbEZpdmVTZXJ2aWNlczEyMzQ1Ng==
  expiration: 86400000
management:
  server:
    port: 8080

  endpoints:
    enabled-by-default: true
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      enabled: true
      show-details: always

  health:
    defaults:
      enabled: true

  metrics:
    enable:
      spring:
        data: true

  observations:
    enable:
      spring:
        data: true